<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HedgeMind — API Key Test</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#07090d; color:#f1f5f9; font-family:Inter,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.box { background:#111820; border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:30px; width:100%; max-width:500px; }
h1 { font-size:20px; color:#c9a84c; margin-bottom:6px; }
p { font-size:12px; color:#64748b; margin-bottom:20px; }
label { font-size:11px; color:#94a3b8; text-transform:uppercase; letter-spacing:0.05em; display:block; margin-bottom:6px; }
input { width:100%; background:#07090d; border:1px solid rgba(255,255,255,0.1); color:#f1f5f9; padding:10px 14px; border-radius:6px; font-family:monospace; font-size:12px; outline:none; margin-bottom:12px; }
input:focus { border-color:#c9a84c; }
button { width:100%; background:linear-gradient(135deg,#c9a84c,#aa8530); border:none; color:#000; padding:11px; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; margin-bottom:10px; }
button:disabled { opacity:0.5; cursor:not-allowed; }
.result { background:#0d1117; border-radius:8px; padding:14px; font-size:12px; font-family:monospace; line-height:1.7; min-height:60px; white-space:pre-wrap; display:none; }
.result.ok { border:1px solid rgba(34,197,94,0.3); color:#22c55e; }
.result.err { border:1px solid rgba(239,68,68,0.3); color:#ef4444; }
.back { display:block; text-align:center; margin-top:14px; font-size:12px; color:#3b82f6; text-decoration:none; }
</style>
</head>
<body>
<div class="box">
  <h1>API-Key Direkt-Test</h1>
  <p>Gibt den Key ein — er wird sofort live getestet ohne gespeichert zu werden.</p>
  <label>Anthropic API Key</label>
  <input type="text" id="keyInput" placeholder="sk-ant-api03-...">
  <button id="testBtn" onclick="runTest()">Key jetzt testen</button>
  <div class="result" id="result"></div>
  <a href="index.html" class="back">← Zurück zum Dashboard</a>
</div>
<script>
async function runTest() {
  const key = document.getElementById('keyInput').value.trim();
  const btn = document.getElementById('testBtn');
  const box = document.getElementById('result');
  if (!key) { alert('Bitte Key eingeben!'); return; }
  btn.disabled = true; btn.textContent = 'Teste...';
  box.style.display = 'block'; box.className = 'result'; box.textContent = '🔄 Verbinde mit Anthropic API...';
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 30,
        messages: [{ role: 'user', content: 'Antworte nur: Verbindung OK' }]
      })
    });
    const data = await res.json();
    if (res.ok) {
      const text = data?.content?.[0]?.text || 'OK';
      box.className = 'result ok';
      box.textContent = '✅ ERFOLGREICH!\n\nStatus: ' + res.status + '\nAntwort: ' + text + '\n\nKey funktioniert — jetzt ins Dashboard eintragen!';
      // Key automatisch in localStorage speichern
      localStorage.setItem('hm_api_key', key);
      setTimeout(() => { window.location.href = 'index.html'; }, 3000);
    } else {
      box.className = 'result err';
      box.textContent = '❌ FEHLER ' + res.status + '\nTyp: ' + (data?.error?.type||'?') + '\nMeldung: ' + (data?.error?.message||'?') + '\n\nKey-Länge: ' + key.length + ' Zeichen\nKey-Start: ' + key.substring(0,20) + '...';
    }
  } catch(e) {
    box.className = 'result err';
    box.textContent = '🔴 Netzwerkfehler: ' + e.message + '\n\nKey-Länge: ' + key.length + ' Zeichen';
  } finally {
    btn.disabled = false; btn.textContent = 'Key jetzt testen';
  }
}
document.getElementById('keyInput').addEventListener('keydown', e => { if(e.key==='Enter') runTest(); });
</script>
</body>
</html>
